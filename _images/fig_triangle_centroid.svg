      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      stroke: var(--geom-assert);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
