      fill-opacity: 0.14;
      stroke: none;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-point-assert {
      fill: var(--geom-assert);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
