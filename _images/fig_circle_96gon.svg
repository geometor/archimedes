<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" width="620" height="290" class="euclid-graphic" data-graphic-id="fig_circle_96gon" data-proposition="Dimensio Circuli 1 &amp; 3">
  <defs>
