  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-dashed {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.72;
    }
    .geom-accent-line {
      stroke: var(--geom-accent);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-assert-line {
      stroke: var(--geom-assert);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-circle {
      stroke: var(--geom-fg);
      stroke-width: 1.65;
      fill: none;
    }
    .geom-circle-accent {
      stroke: var(--geom-accent);
      stroke-width: 2.1;
      fill: var(--geom-accent);
      fill-opacity: 0.10;
    }
    .geom-circle-assert {
      stroke: var(--geom-assert);
      stroke-width: 2.0;
      stroke-dasharray: 6, 3;
      fill: var(--geom-assert);
      fill-opacity: 0.08;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      stroke: var(--geom-assert);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
    }
    .geom-polygon-accent {
      fill: var(--geom-accent);
      fill-opacity: 0.14;
      stroke: none;
    }
    .geom-polygon-assert {
      fill: var(--geom-assert);
      fill-opacity: 0.14;
      stroke: none;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-point-assert {
      fill: var(--geom-assert);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-label-accent {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-accent);
      user-select: none;
    }
    .geom-label-assert {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-assert);
      user-select: none;
    }
