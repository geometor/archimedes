    <circle cx="283.75" cy="80.29" r="56.25" class="geom-circle-assert" data-ref="( W1 T1 )" />
    <circle cx="396.25" cy="121.70" r="56.25" class="geom-circle-assert" data-ref="( W2 T2 )" />
  </g>
  <g id="graphics">
    <path d="M 40.00 264.00 A 240.00 240.00 0 0 1 280.00 24.00 A 240.00 240.00 0 0 1 520.00 264.00" class="geom-bold" data-ref="( O A )" />
    <path d="M 40.00 264.00 A 150.00 150.00 0 0 1 190.00 114.00 A 150.00 150.00 0 0 1 340.00 264.00" class="geom-bold" data-ref="( O1 A )" />
    <path d="M 340.00 264.00 A 90.00 90.00 0 0 1 430.00 174.00 A 90.00 90.00 0 0 1 520.00 264.00" class="geom-bold" data-ref="( O2 C )" />
    <path d="M 40.00 264.00 L 280.00 264.00 L 520.00 264.00" class="geom-bold" data-ref="/ A B /" />
    <path d="M 340.00 264.00 L 340.00 147.81 L 340.00 31.62" class="geom-accent-line" data-ref="/ C D /" />
    <path d="M 283.75 80.29 L 311.88 80.29 L 340.00 80.29" class="geom-assert-line" data-ref="/ W1 K1 /" marker-mid="url(#geom-tick-1)" />
    <path d="M 396.25 121.70 L 368.12 121.70 L 340.00 121.70" class="geom-assert-line" data-ref="/ W2 K2 /" marker-mid="url(#geom-tick-1)" />
  </g>
  <g id="highlights" style="pointer-events: none;"></g>
  <g id="points">
    <circle cx="40.00" cy="264.00" r="3.20" class="geom-point" data-ref="A" />
    <circle cx="340.00" cy="264.00" r="3.20" class="geom-point-accent" data-ref="C" />
    <circle cx="520.00" cy="264.00" r="3.20" class="geom-point" data-ref="B" />
    <circle cx="340.00" cy="31.62" r="3.20" class="geom-point-accent" data-ref="D" />
    <circle cx="283.75" cy="80.29" r="3.20" class="geom-point-assert" data-ref="W1" />
    <circle cx="396.25" cy="121.70" r="3.20" class="geom-point-assert" data-ref="W2" />
  </g>
  <g id="labels">
    <text x="280.00" y="22.00" text-anchor="middle" class="geom-label-sm">Book of Lemmas (Props. 4–5): The Arbelos &amp; Archimedes' Twin Circles</text>
    <text x="40.00" y="282.00" text-anchor="middle" class="geom-label">A</text>
    <text x="340.00" y="282.00" text-anchor="middle" class="geom-label-accent">C</text>
    <text x="520.00" y="282.00" text-anchor="middle" class="geom-label">B</text>
    <text x="352.00" y="33.62" text-anchor="middle" class="geom-label-accent">D</text>
    <text x="275.75" y="84.29" text-anchor="end" class="geom-label-assert">W₁</text>
    <text x="404.25" y="125.70" text-anchor="start" class="geom-label-assert">W₂</text>
    <text x="145.00" y="76.00" text-anchor="middle" class="geom-label-accent">Prop. 4: Area(Arbelos) = π · (CD/2)²</text>
    <text x="280.00" y="294.00" text-anchor="middle" class="geom-label-assert">Prop. 5: Twin Radii r₁ = r₂ = (r_AC · r_CB) / (r_AC + r_CB)</text>
  </g>
